# F-Droid build recipe for ReteKey.
#
# This is the file that goes into the fdroiddata repository on GitLab, as
# metadata/dev.hellgates.retekeyime.yml. It is kept here so the recipe and the build it drives
# change together, and so anyone can see how the F-Droid build is defined without leaving this repo.
#
# Only the `modern` flavour is published here. Both flavours carry the same applicationId, so one
# package can serve only one of them, and `modern` is what the README's own download link serves.
# The `legacy` build (Android 4.0 and up) stays on the releases page.
#
# Binaries + AllowedAPKSigningKeys make this a reproducible build: F-Droid compiles the app on its
# own server, compares the result against the APK published on the releases page, and on a match
# ships that file signed with this project's key rather than F-Droid's. That is only possible
# because a clean clone builds byte-identically — `vcsInfo { include = false }` in app/build.gradle
# is what makes it so, by keeping the builder's git checkout out of the APK. It also means the
# signing key must be kept: losing it ends the ability to update the app.

Categories:
